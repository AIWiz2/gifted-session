<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECOWSCO-MD</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    :root {
        --primary: #1e90ff; /* blue */
        --secondary: #00bfff;
        --accent: #00ffff;
        --dark: rgba(16, 0, 43, 0.6);
        --light: #f0f8ff;
        --shadow: 0 10px 30px rgba(0,0,0,0.2);
        --card-bg: rgba(255,255,255,0.1);
    }

    * { margin:0; padding:0; box-sizing:border-box; }
    body {
        font-family: 'Poppins', sans-serif;
        min-height:100vh;
        display:flex;
        flex-direction:column;
        background: linear-gradient(135deg, #1e90ff33, #00bfff33);
        backdrop-filter: blur(10px);
        color: var(--light);
    }

    footer {
        margin-top:auto;
        padding:2rem;
        text-align:center;
        background: var(--card-bg);
        backdrop-filter: blur(15px);
        border-top: 1px solid rgba(0, 191, 255, 0.3);
        box-shadow: var(--shadow);
        border-radius: 15px 15px 0 0;
        font-weight: 500;
        font-size: 1rem;
        color: var(--light);
    }

    footer a {
        color: var(--primary);
        text-decoration: none;
        font-weight: 600;
    }

    /* Optional subtle background particles */
    .particles {
        position: fixed;
        top:0; left:0;
        width:100%; height:100%;
        z-index:-1;
        overflow:hidden;
    }
    .particle {
        position:absolute;
        width:10px; height:10px;
        background: rgba(30,144,255,0.3);
        border-radius:50%;
        animation: float linear infinite;
    }
    @keyframes float {
        0% { transform: translateY(0) rotate(0deg); }
        100% { transform: translateY(-100vh) rotate(360deg); }
    }
</style>
</head>
<body>
    <div class="particles" id="particles"></div>

    <footer>
        MADE BY THEAIKID | © 2026 | ECOWSCO-MD
    </footer>

    <script>
        // optional: generate some particles for glassy effect
        const particlesContainer = document.getElementById('particles');
        for(let i=0;i<50;i++){
            const p = document.createElement('div');
            p.classList.add('particle');
            p.style.left = Math.random()*100 + 'vw';
            p.style.top = Math.random()*100 + 'vh';
            p.style.width = p.style.height = (Math.random()*8 + 4)+'px';
            p.style.animationDuration = (Math.random()*5 + 5) + 's';
            particlesContainer.appendChild(p);
        }
    </script>
</body>
</html>
