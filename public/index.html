<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECOWSCO-MD</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root {
    --primary: #1e90ff; /* neon blue */
    --light: #ffffff;
    --glass-bg: rgba(30,144,255,0.15);
    --glass-border: rgba(30,144,255,0.4);
    --shadow: 0 8px 32px rgba(30,144,255,0.4);
    --blur: 12px;
    --radius: 20px;
    --transition: all 0.4s ease;
  }

  body {
    margin: 0;
    padding: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, rgba(30,144,255,0.1), rgba(0,0,128,0.1));
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    color: var(--light);
    overflow-x: hidden;
  }

  /* Particles background */
  .particles {
    position: fixed;
    top:0; left:0;
    width: 100%;
    height: 100%;
    z-index: -1;
    overflow: hidden;
  }

  .particle {
    position: absolute;
    width: 6px;
    height: 6px;
    background: rgba(30,144,255,0.3);
    border-radius: 50%;
    animation: float linear infinite;
  }

  @keyframes float {
    0% { transform: translateY(0) rotate(0deg); }
    100% { transform: translateY(-100vh) rotate(360deg); }
  }

  /* Header / logo */
  header {
    width: 100%;
    padding: 2rem 0;
    text-align: center;
    backdrop-filter: blur(var(--blur));
  }

  header h1 {
    font-size: 3rem;
    background: linear-gradient(to right, var(--primary), #00bfff);
    -webkit-background-clip: text;
    color: transparent;
    margin: 0;
  }

  /* Hero Section */
  .hero {
    width: 90%;
    max-width: 800px;
    margin: 3rem auto 5rem;
    padding: 2rem;
    text-align: center;
    background: var(--glass-bg);
    border-radius: var(--radius);
    border: 1px solid var(--glass-border);
    box-shadow: var(--shadow);
    backdrop-filter: blur(var(--blur));
    transition: var(--transition);
  }

  .hero h2 {
    margin: 0;
    font-size: 2rem;
    background: linear-gradient(to right, var(--primary), #00bfff);
    -webkit-background-clip: text;
    color: transparent;
  }

  /* Footer */
  footer {
    background: var(--glass-bg);
    color: var(--primary);
    padding: 1.5rem 3rem;
    text-align: center;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(var(--blur));
    font-weight: 600;
    margin-top: auto;
    position: relative;
    overflow: hidden;
  }

  footer::before, footer::after {
    content: '';
    position: absolute;
    width: 120%;
    height: 2px;
    background: linear-gradient(90deg, rgba(30,144,255,0), var(--primary), rgba(30,144,255,0));
    top: 0;
    left: -10%;
    animation: slide 3s linear infinite;
  }

  footer::after {
    top: auto;
    bottom: 0;
    animation-delay: 1.5s;
  }

  @keyframes slide {
    0% { left: -10%; }
    50% { left: 10%; }
    100% { left: -10%; }
  }

  footer a {
    color: var(--primary);
    text-decoration: none;
    font-weight: 700;
  }

  @media(max-width:768px){
    header h1 { font-size: 2rem; }
    .hero h2 { font-size: 1.5rem; }
    .hero { padding: 1.5rem; }
    footer { padding: 1rem 2rem; }
  }
</style>
</head>
<body>

<div class="particles" id="particles"></div>

<header>
  <h1>ECOWSCO-MD</h1>
</header>

<!-- Hero Message -->
<section class="hero">
  <h2>Your Advanced WhatsApp Bot Solution</h2>
</section>

<footer>
  MADE BY THEAIKID | © 2026 | <a href="#">ECOWSCO-MD</a>
</footer>

<script>
  // Generate floating particles
  const particlesContainer = document.getElementById('particles');
  for(let i=0;i<60;i++){
    const p = document.createElement('div');
    p.classList.add('particle');
    p.style.left = Math.random()*100+'vw';
    p.style.animationDuration = 5+Math.random()*10+'s';
    const size = 4+Math.random()*8;
    p.style.width = p.style.height = size+'px';
    particlesContainer.appendChild(p);
  }
</script>

</body>
</html>
